appId: com.gaganstudio.gsd
productName: GSD
artifactName: GSD-Setup-${version}-${arch}.${ext}
asar: true
compression: normal
beforePack: scripts/verify-package.cjs
directories:
  output: release
  buildResources: build
files:
  - dist/frontend/**/*
  - backend/**/*.js
  - backend/utils/kill-tree.ps1
  - "!backend/tests{,/**/*}"
  - "!backend/binaries{,/**/*}"
  - electron/**/*
  - build/icon.ico
  - package.json
extraResources:
  - from: backend/binaries
    to: binaries
    filter:
      - "**/*"
  - from: build/THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
win:
  icon: build/icon.ico
  executableName: GSD
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GSD
  uninstallDisplayName: GSD
  deleteAppDataOnUninstall: false
  runAfterFinish: false
publish: null
